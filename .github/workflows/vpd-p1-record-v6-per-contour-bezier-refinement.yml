name: VPD P1 Record V6 Per-Contour Bezier Refinement

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_repair_v6/TRIGGER_RECORD_V6_PER_CONTOUR_BEZIER_REFINEMENT.txt'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Record V6 per-contour Bezier refinement
        run: python scripts/vpd_record_v6_per_contour_bezier_refinement.py
      - name: Validate current state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Persist per-contour-Bezier state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json evidence/vpd/p1_typography_repair_v6/V6_PER_CONTOUR_BEZIER_REFINEMENT_20260915.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record V6 per-contour Bezier refinement and await human review"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
