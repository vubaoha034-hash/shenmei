name: visual-workflow-v020
on:
  pull_request:
    paths:
      - 'plugins/visual-aesthetic-workflow/v0.2.0/**'
      - 'plugins/visual-aesthetic-workflow/SKILL.md'
      - '.github/workflows/visual-workflow-v020.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/visual-aesthetic-workflow/v0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: visual-workflow-v020-dist
          path: plugins/visual-aesthetic-workflow/v0.2.0/dist
          if-no-files-found: error
