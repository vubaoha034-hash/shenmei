name: VPD P1 Record Chazuo V6 Hifi Human Fail

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_repair_v7/TRIGGER_RECORD_CHAZUO_V6_HIFI_HUMAN_FAIL.txt'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Record Chazuo V6 hifi human fail and route stop
        run: python scripts/vpd_record_chazuo_v6_hifi_human_fail.py
      - name: Validate current state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Persist human fail state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json evidence/vpd/p1_typography_repair_v7/CHAZUO_V6_HIFI_HUMAN_REJECTION_20260916.json visual_memory/vpd_p6_composition_state.py
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record Chazuo V6 hifi human fail and stop vector-only surface route"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
