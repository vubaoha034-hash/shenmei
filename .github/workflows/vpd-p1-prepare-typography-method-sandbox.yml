name: VPD P1 Prepare Typography Method Sandbox

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_research_sandbox_v1/TRIGGER_PREPARE_TYPOGRAPHY_METHOD_SANDBOX.txt'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Prepare typography method sandbox
        run: python scripts/vpd_prepare_typography_method_sandbox.py
      - name: Validate current state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Persist typography method sandbox state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json visual_memory/vpd_p6_composition_state.py
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Prepare typography method sandbox test 01"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
