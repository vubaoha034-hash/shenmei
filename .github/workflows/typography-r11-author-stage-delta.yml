name: R11 Real Designer Before-After Image Delta Gate
on:
  push:
    branches:
      - research/typography-r11-authored-delta-20261027
    paths:
      - .github/workflows/typography-r11-author-stage-delta.yml
permissions:
  contents: write
jobs:
  source-revision-byte-and-color-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric image reader
        run: python -m pip install --disable-pip-version-check --quiet numpy==1.26.4 scipy==1.13.1 pillow==11.1.0
      - name: Inspect source author's real before after images in memory
        run: python research/typography_r11/verify_original_revision_pixels.py
      - name: Store only source receipt and derived statistics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='research/typography_r11/R11_REAL_AUTHOR_STAGE_PIXEL_DIAGNOSTICS.json'
          d=json.load(open(p,encoding='utf8'))
          assert d['rights_safe'] and d['copyrighted_source_images_committed'] is False
          assert all(v.get('sha256') for v in d['source_images'])
          print('R11_RECEIPT_SAVE',len(d['source_images']),len(d['failures']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/typography_r11/R11_REAL_AUTHOR_STAGE_PIXEL_DIAGNOSTICS.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(r11): original publisher before-after image checksums and limited measured deltas'
            git push origin HEAD:research/typography-r11-authored-delta-20261027
          fi
      - name: Substantive source gate cannot be green for no actual before-after
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/typography_r11/R11_REAL_AUTHOR_STAGE_PIXEL_DIAGNOSTICS.json'))
          assert d['source_gate_pass'] is True, 'NO_ACTUAL_DESIGNER_BEFORE_AFTER_PIXELS'
          assert d['pixel_artifact_shas_verified']>=3
          assert d['valid_same_glyph_before_after_source'] is True
          assert d['human_aesthetic_blind_pass'] is False
          print('R11_AUTHOR_BEFORE_AFTER_EVIDENCE_VERIFIED')
          PY
