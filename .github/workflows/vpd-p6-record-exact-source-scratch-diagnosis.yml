name: VPD P6 Record Exact Source Scratch Diagnosis

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - ".github/workflows/vpd-p6-record-exact-source-scratch-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Record diagnosis
        run: python scripts/vpd_p6_record_exact_source_scratch_diagnosis.py
      - name: Validate authority
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Regression
        run: python -m pytest -q tests/visual_memory/test_vpd_p6_relay_state.py
      - name: Commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/system_validation.jsonl PROJECT_CONTROL_ADAPTER.json evidence/vpd/p6_authority_repair_v1/DOUFANG_B_EXACT_SOURCE_SCRATCH_DIAGNOSIS_20260914.json
          git diff --cached --quiet && { echo "No transition changes"; exit 1; }
          git commit -m "Record Doufang B exact-source scratch diagnosis"
          git pull --rebase origin visual-program-distillation-v2-photography-design-20260814
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
