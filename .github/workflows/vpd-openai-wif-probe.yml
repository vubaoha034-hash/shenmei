name: VPD OpenAI WIF Probe

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - "scripts/probe_vpd_openai_wif.py"
      - ".github/workflows/vpd-openai-wif-probe.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
  OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
  OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current official OpenAI Python SDK
        run: python -m pip install --disable-pip-version-check openai

      - name: Probe WIF without image generation
        id: probe
        continue-on-error: true
        run: >-
          python scripts/probe_vpd_openai_wif.py
          --output continuity/vpd/OPENAI_AUTH_PROBE.json

      - name: Persist redacted probe receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/OPENAI_AUTH_PROBE.json
          if git diff --cached --quiet; then
            echo "No probe receipt change to persist."
          else
            git commit -m "Record VPD OpenAI WIF auth probe"
            git pull --rebase origin visual-program-distillation-v2-photography-design-20260814
            git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
          fi

      - name: Enforce probe pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("continuity/vpd/OPENAI_AUTH_PROBE.json").read_text(encoding="utf-8"))
          print("VPD OpenAI WIF probe status:", p.get("status"))
          raise SystemExit(0 if p.get("status") == "WIF_AUTH_AND_PINNED_MODEL_METADATA_PASS" else 1)
          PY
