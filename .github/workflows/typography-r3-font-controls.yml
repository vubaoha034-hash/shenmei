name: R3 Same Text Typeface Baselines

on:
  push:
    branches:
      - research/typography-r3-rosanjin-source-20261026
    paths:
      - .github/workflows/typography-r3-font-controls.yml

permissions:
  contents: write

jobs:
  run-matched-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install CJK fonts from distro
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk fonts-arphic-bkai00mp
          fc-match -f '%{file}|%{index}|%{family}\n' 'Noto Serif CJK TC'
          fc-match -f '%{file}|%{index}|%{family}\n' 'Noto Sans CJK TC'
          fc-match -f '%{file}|%{index}|%{family}\n' 'AR PL KaitiM Big5'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analytic packages
        run: python -m pip install --disable-pip-version-check --quiet pillow fonttools scipy numpy scikit-image
      - name: Run exact-character controlled comparison
        run: python research/typography_r3/matched_type_controls.py
      - name: Commit derived metrics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/typography_r3/ROSANJIN_MATCHED_FONT_CONTROLS.json
          if git diff --cached --quiet; then
            echo "No changed receipt to commit"
          else
            git commit -m "evidence(r3): save 3x3x2 exact-text font morphology controls"
            git push origin HEAD:research/typography-r3-rosanjin-source-20261026
          fi
