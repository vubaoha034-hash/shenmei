name: R4 Expressive Typeface Counterfactual

on:
  push:
    branches: [research/typography-r3-rosanjin-source-20261026]
    paths:
      - .github/workflows/typography-r4-expressive-controls.yml
      - research/typography_r3/expressive_font_counterfactual.py

permissions:
  contents: write

jobs:
  compare-expressive-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pillow fonttools numpy scipy scikit-image
      - name: Execute source-hashed exact-glyph expressive comparisons
        run: python research/typography_r3/expressive_font_counterfactual.py
      - name: Preserve derived numbers, not the font binaries or original artwork
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/typography_r3/R4_EXPRESSIVE_SAME_TEXT_CONTROLS.json
          if git diff --cached --quiet; then
            echo "No changed R4 evidence"
          else
            git commit -m "evidence(r4): archive author vs expressive calligraphic font controls"
            git push origin HEAD:research/typography-r3-rosanjin-source-20261026
          fi
