name: VPD P1 Settle V5 Selection And Prepare Noncalligraphic V6

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_repair_v6/TRIGGER_SETTLE_V5_SELECTION_PREPARE_V6.txt'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Settle V5 selection and prepare V6
        run: python scripts/vpd_settle_v5_selection_prepare_noncalligraphic_v6.py
      - name: Validate new state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Persist V5 selection and V6 preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json visual_memory/vpd_p6_composition_state.py evidence/vpd/p1_typography_repair_v6/V5_HUMAN_SELECTION_AND_NONCALLIGRAPHIC_V6_PLAN_20260914.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record V5 human seed selection and prepare noncalligraphic V6"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
