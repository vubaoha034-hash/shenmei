name: VPD Figma Doufang A Large Control

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - "evidence/vpd/figma_upload_relay/doufang_a_control_triggers/*-02.cms.b64"

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      RELAY_PRIVATE_KEY_B64: ${{ secrets.VPD_FIGMA_RELAY_PRIVATE_KEY_B64 }}
      TARGET_NODE: "44:3"
      SOURCE_NODE: "12:4"
      EXPECTED_SOURCE_SHA256: 45943cf0b0d04e11e19694a6b1e04cf6fcf29a9b97832ee93bdf2f08d0c57909
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Require relay key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELAY_PRIVATE_KEY_B64:-}"
          umask 077
          printf '%s' "$RELAY_PRIVATE_KEY_B64" | base64 --decode > /tmp/vpd-key.pem
          openssl pkey -in /tmp/vpd-key.pem -check -noout >/dev/null
      - name: Execute Doufang A bound-node PNG scratch control
        id: relay
        shell: bash
        run: |
          set -uo pipefail
          failures=0; found=0
          shopt -s nullglob
          for t in evidence/vpd/figma_upload_relay/doufang_a_control_triggers/*-02.cms.b64; do
            found=1
            base="$(basename "$t" .cms.b64)"
            der="/tmp/$base.cms"; receipt="evidence/vpd/figma_upload_relay/receipts/$base.json"
            base64 --decode "$t" > "$der" || { failures=$((failures+1)); continue; }
            if python scripts/vpd_figma_remote_source_control_relay.py \
              --trigger "$der" \
              --cert evidence/vpd/figma_upload_relay/relay-cert.pem \
              --private-key /tmp/vpd-key.pem \
              --receipt "$receipt" \
              --expected-node-id "$TARGET_NODE" \
              --expected-source-sha256 "$EXPECTED_SOURCE_SHA256" \
              --expected-source-node-id "$SOURCE_NODE" \
              --expected-format png; then
              git rm -f "$t"
            else
              failures=$((failures + 1))
            fi
            [ ! -f "$receipt" ] || git add "$receipt"
          done
          test "$found" -eq 1
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
      - name: Persist diagnostic receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Record Doufang A bound-node PNG scratch control receipt"
            git pull --rebase origin visual-program-distillation-v2-photography-design-20260814
            git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
          fi
      - name: Enforce success
        if: steps.relay.outputs.failures != '0'
        run: exit 1
