name: R10 Same-Glyph Before-After Pixel Evidence Audit
on:
  push:
    branches:
      - research/typography-r10-authored-stage-images-20261027
    paths:
      - .github/workflows/typography-r10-authored-visual-review.yml
permissions:
  contents: write
jobs:
  observe-creator-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-independent image math
        run: python -m pip install --disable-pip-version-check --quiet pillow numpy scipy
      - name: Inspect authentic author-published stage pixels in RAM
        run: python research/typography_r10/inspect_author_revision_pixels.py
      - name: Archive derived-only evidence before enforcing gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          a=json.load(open('research/typography_r10/R10_AUTHORED_STAGE_VISUAL_AUDIT.json'))
          assert a['verified_no_raw_visual_redistribution']
          assert all(s['raw_source_images_committed'] is False for s in a['stage_sources'])
          assert a['claim_validated_creator_method'] is False
          print('R10_UNCOPYRIGHTED_EVIDENCE_SAVED',a['source_images_reverified'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/typography_r10/R10_AUTHORED_STAGE_VISUAL_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(r10): first-party image pixel before-after verification, without original artwork"
            git push origin HEAD:research/typography-r10-authored-stage-images-20261027
          fi
      - name: Enforce truthful source-only pass
        run: |
          python - <<'PY'
          import json
          a=json.load(open('research/typography_r10/R10_AUTHORED_STAGE_VISUAL_AUDIT.json'))
          assert a['minimum_gate_pass'] is True, 'R10_AUTHOR_STAGE_PIXELS_NOT_SATISFACTORY'
          assert a['actual_author_revision_or_draft_sources']==3
          assert a['author_variant_not_timeline_sources']==1
          assert a['human_blind_aesthetic_review']=='NOT_RUN'
          assert a['new_unseen_Chinese_lettering_output']=='NOT_RUN'
          print('R10_REAL_BEFORE_AFTER_SOURCE_EVIDENCE_PASS_NOT_TRANSFER_SUCCESS')
          PY
