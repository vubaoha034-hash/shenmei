name: VPD P6 Record Human Typography Fail

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p6_equal_budget_integrated_design_v1/TRIGGER_P6_HUMAN_TYPOGRAPHY_FAIL.txt'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0

      - name: Record human typography fail
        run: python scripts/vpd_record_p6_human_typography_fail.py

      - name: Validate new state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card

      - name: Persist human verdict state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json evidence/vpd/p6_equal_budget_integrated_design_v1/P6_HUMAN_SET_VERDICT_TYPOGRAPHY_FAIL_20260914.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record P6 human typography failure verdict"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
