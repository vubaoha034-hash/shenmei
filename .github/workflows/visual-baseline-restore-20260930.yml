name: Read back published visual baseline restoration
on:
  push:
    branches: [verify/visual-baseline-restore-20260930-01]
permissions:
  contents: read
jobs:
  published_readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_HEAD: 53d4a6f490bb03766ec57810c60d6a7a2f829cc3
      TARGET_BRANCH: visual-program-distillation-v2-photography-design-20260814
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 53d4a6f490bb03766ec57810c60d6a7a2f829cc3
          fetch-depth: 2
          persist-credentials: false
      - name: Read actual published commit and native status
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/visual-published"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          python scripts/verify_visual_memory.py --vpd-state --status-card | tee "$OUT/current-status.json"
          export OUT
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,hashlib,os
          out=Path(os.environ['OUT']);root=Path('.')
          base='6c9a4f67206156443ec6320f6bbd1cc5bf9a543e'
          files=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert len(files)==8,'WRITE_SCOPE_CHANGED'
          receipt='evidence/vpd/p1_typography_research_sandbox_v1/CHAZUO_NEW_IMAGE_COMPOSITION01_EXECUTION_20260930.json'
          r=json.loads((root/receipt).read_text())
          guard='continuity/vpd/VISUAL_MASTER_FREEZE_GUARD_V1.json'
          g=json.loads((root/guard).read_text());old=json.loads(subprocess.check_output(['git','show',base+':'+guard]))
          for k in ['core_invariants','current_chazuo_freeze_map','mandatory_next_loop']:assert g[k]==old[k]
          ledger='continuity/vpd/state_ledger/commercial_design_pipeline.jsonl'
          before=subprocess.check_output(['git','show',base+':'+ledger]);after=(root/ledger).read_bytes()
          assert after.startswith(before) and len(after.splitlines())==len(before.splitlines())+1
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          (out/'scoped-comparison.json').write_text(json.dumps(r['coordinator_baseline_comparison'],ensure_ascii=False,indent=2))
          report={'task_id':'VPD-BASELINE-RESTORE-AND-REGRESSION-01','published_head':os.environ['EXPECTED_HEAD'],'branch':os.environ['TARGET_BRANCH'],'status':'PUBLISHED_AND_NATIVE_READBACK_PASS','lock_revision':179,'checkpoint_sequence':201,'changed_files':files,'file_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in files},'previous_real_mutation_test_run':36667023653,'historical_guard_semantics_preserved':True,'prior_ledger_bytes_preserved':True,'new_images':0,'figma_writes':0,'independent_aesthetic_evaluator_validated':False,'historical_original_png_bytes_rehashed_this_task':False,'new_human_quality_acceptance':False}
          (out/'publication-receipt.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-baseline-published-readback
          path: ${{ runner.temp }}/visual-published
          retention-days: 30
