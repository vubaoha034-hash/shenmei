name: VPD P1 Record V6 And Prepare Figma Vector Reconstruction

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_repair_v6/TRIGGER_RECORD_V6_PREPARE_FIGMA_VECTOR.txt'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Record V6 and prepare Figma vector reconstruction
        run: python scripts/vpd_record_v6_and_prepare_figma_vector_reconstruction_fixed.py
      - name: Validate new state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Persist V6 settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json visual_memory/vpd_p6_composition_state.py evidence/vpd/p1_typography_repair_v6/NONCALLIGRAPHIC_SEMANTIC_WORDMARK_V6_EXECUTION_20260915.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record V6 directional positive and prepare Figma vector reconstruction"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
