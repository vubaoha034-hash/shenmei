name: VPD P1 Record Semantic Anchor Wordmark V3 Execution

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_repair_v3/TRIGGER_RECORD_WORDMARK_V3_EXECUTION.txt'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0

      - name: Record semantic-anchor Wordmark V3 execution
        run: python scripts/vpd_record_semantic_anchor_wordmark_v3_execution.py

      - name: Validate new state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card

      - name: Persist V3 execution state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json visual_memory/vpd_p6_composition_state.py evidence/vpd/p1_typography_repair_v3/SEMANTIC_ANCHOR_WORDMARK_V3_EXECUTION_20260914.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record semantic-anchor Wordmark V3 execution"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
