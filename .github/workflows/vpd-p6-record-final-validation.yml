name: VPD P6 Record Final Validation

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - "evidence/vpd/p6_equal_budget_integrated_design_v1/final_validation_triggers/*.txt"

permissions:
  contents: write

concurrency:
  group: vpd-p6-final-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0

      - name: Record P6 final validation
        run: python scripts/vpd_record_p6_final_validation.py

      - name: Validate new state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card

      - name: Persist final validation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            evidence/vpd/p6_equal_budget_integrated_design_v1/P6_FINAL_PIXEL_EDITABILITY_VALIDATION_20260914.json \
            continuity/vpd/CURRENT_TASK_LOCK.json \
            continuity/vpd/LATEST_CHECKPOINT.json \
            continuity/vpd/state_ledger/commercial_design_pipeline.jsonl \
            PROJECT_CONTROL_ADAPTER.json
          if git diff --cached --quiet; then
            echo "No final-validation state changes to persist."
          else
            git commit -m "Record P6 final pixel and editability validation"
            git pull --rebase origin visual-program-distillation-v2-photography-design-20260814
            git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
          fi
