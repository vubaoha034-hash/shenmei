name: VPD P1 Record Typography Method Sandbox Test01 Fail

on:
  push:
    branches:
      - visual-program-distillation-v2-photography-design-20260814
    paths:
      - 'evidence/vpd/p1_typography_research_sandbox_v1/TRIGGER_RECORD_TYPOGRAPHY_METHOD_TEST01_FAIL.txt'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact VPD branch
        uses: actions/checkout@v4
        with:
          ref: visual-program-distillation-v2-photography-design-20260814
          fetch-depth: 0
      - name: Record sandbox Test01 fail
        run: python scripts/vpd_record_typography_method_sandbox_test01_fail.py
      - name: Validate current state
        run: python scripts/verify_visual_memory.py --vpd-state --status-card
      - name: Persist Test01 fail state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add continuity/vpd/CURRENT_TASK_LOCK.json continuity/vpd/LATEST_CHECKPOINT.json continuity/vpd/state_ledger/commercial_design_pipeline.jsonl PROJECT_CONTROL_ADAPTER.json visual_memory/vpd_p6_composition_state.py evidence/vpd/p1_typography_research_sandbox_v1/TYPOGRAPHY_METHOD_SANDBOX_TEST01_FAIL_20260916.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Record typography sandbox Test01 fail and open Test02"
          git push origin HEAD:visual-program-distillation-v2-photography-design-20260814
